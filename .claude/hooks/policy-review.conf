# Read by guardrail-manager's policy-review-reminder Stop hook (oeid-claude-plugins).
# A section fires when SIGNAL_REGEX matches this session's transcript and DONE_REGEX does
# not. Regexes are Python `re`, case-insensitive. Always advisory; never blocks.
#
# Every pattern is tied to what a tool was asked to do, not to a bare word:
#   - `"file_path":"...` or `"command":"...` for a file read or edited, or a shell command;
#   - a Write's `"content"` or an Edit's `"new_string"`, right after a `.md`/`.mdx`
#     `"file_path"`, for text written into a page (premium front matter is page text, never a
#     path, so it is matched where it is written). A bare `"content":"` is not enough: every
#     tool result is saved under that key too, CLAUDE.md text included. The `.md`/`.mdx` rule
#     keeps an edit to this file (whose MESSAGE names premium_teaser) from firing;
#   - `"skill":"privacy-review"` (or reading that skill's SKILL.md) for the review itself.
# Why, the same two problems the hub's conf hit on 2026-10-23: Claude Code saves CLAUDE.md
# text in the session log, so bare words like "premium: true" or "privacy-review" matched in
# every session; and a word in command output (a `git status` listing, a grep hit) counted as
# if the work had been done. Inside a tool's output the JSON is escaped (\"file_path\":\"),
# so these anchors match only the call itself.
# The DONE pattern must not match the MESSAGE below or this file's own text: the message is
# saved in the log once it is shown, and reading this file puts its text there too.
#
# CHANNEL = system: the default (stderr) is not shown to anyone on a Stop hook that exits 0
# (the hooks docs send it to the debug log), so the reminder never reached Omar. `system`
# prints a systemMessage, which the docs call a warning shown to the user.
#
# [privacy] began as .claude/hooks/privacy-review-reminder.sh, which used bare words. Examples:
#   fires:  a tool call with "file_path":".../docs/journey/career-development/foo.mdx"
#   fires:  a tool call with "new_string":"---\ntitle: 'Q'\npremium: true\n---"
#   quiet:  either of those plus a "skill":"privacy-review" call in the same session
#   quiet:  "premium: true" or "career-development" only in CLAUDE.md text or command output
#   quiet:  `claude --resume <id>`: the (?<!--) before "resume" skips that flag, not a resume file

[privacy]
SIGNAL_REGEX = "(?:file_path|command)":"(?:[^"\\]|\\.)*?(?:career-development|job.?search|recruiter|outreach|(?<!--)resume|cover.?letter|(?:personal|confidential)[- ]?(?:finance|health|family|material))|"file_path":"[^"]*\.mdx?",(?:"old_string":"(?:[^"\\]|\\.)*",)?"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:premium:\s*true|premium_teaser)
DONE_REGEX   = "skill":"privacy-review"|"file_path":"[^"]*privacy-review/SKILL\.md
MESSAGE      = 🔐 privacy-review reminder: this session touched sensitive/personal/premium content.
    Before publishing, un-drafting, or deploying it, run the privacy-review skill.
    Remember the mental model: premium gating encrypts the BODY only. The title, slug/URL,
    description, premium_teaser, tags, and any README that LISTS the doc all ship PUBLIC in
    clear. Premium hides the CONTENT, not the FACT (a gated "Targeting Director at LangChain"
    doc still broadcasts the job search via its title + URL + teaser).
    Two passes: (1) audit the clear-fields for leaks; (2) read it as an employer / competitor /
    recruiter / search engine. Then pick a disposition: publish · de-identify into a case study ·
    draft:true · or keep OFF the repo (local file + purge git). This is advisory; it will not block.
CHANNEL      = system
